name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The kit enforces itself: its own gates must pass on its own source.
      # `npm run gates` is the single source of truth, so a gate added there is
      # never silently absent from CI (encoding and docs-links were, once).
      - run: npm run gates
      - run: node scripts/anti-slop/generate-component-index.mjs --src scripts --check
