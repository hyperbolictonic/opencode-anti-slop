name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The kit enforces itself: its own gates must pass on its own source.
      # `npm run gates` is the single source of truth, so a gate added there is
      # never silently absent from CI (encoding and docs-links were, once).
      - run: npm run gates
      - run: node scripts/anti-slop/generate-component-index.mjs --src scripts --check

  site:
    # The Pages site is built from source on every push, so a broken page is a
    # red CI run rather than a broken deploy discovered after merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
